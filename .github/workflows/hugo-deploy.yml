name: Deploy Hugo Site to Pages

on:
  push:
    branches: ["main", "hugo-template"]

# Job permissions
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to running with bash
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.124.1" # A recent, stable version
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${{ env.HUGO_VERSION }}/hugo_extended_${{ env.HUGO_VERSION }}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set Indexing Policy
        run: |
          if [[ "${{ steps.pages.outputs.base_url }}" != "https://giuliadangelo.github.io" ]]; then
            echo "Non-production URL detected. Setting NOINDEX flag for Hugo build."
            echo "HUGO_PARAMS_NOINDEX=true" >> $GITHUB_ENV
          else
            echo "Production URL detected. Allowing indexing."
          fi

      - name: Build with Hugo
        env:
          # This passes the NOINDEX param to Hugo
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4