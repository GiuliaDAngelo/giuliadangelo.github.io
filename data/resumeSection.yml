experience:
  - content: >
      #### Marie Skłodowska-Curie Postdoctoral Fellow
      *Czech Technical University (Prague, Czechia)*

      Principal Investigator & Project Leader for the ENDEAVOR project, focusing on event-based active vision and neuromorphic computing for object perception.
    time: 2024 - NOW
  - content: >
      #### Postdoctoral Researcher - Computer Vision for Robotics
      *Italian Institute of Technology (Italy)*

      Led R&D and project management for event-driven perception in robotics.
    time: 2022 - 2024
  - content: >
      #### Visiting Researcher - Embodiment for Robotics
      *Czech Technical University (Prague, Czechia)*

      Focused on Embodied Cognition and Sensorimotor Contingency Theory for visual robotics.
    time: May-June, 2023
  - content: >
      #### Ph.D. Computer Vision for Robotics (President's Doctoral Scholar)
      *The University of Manchester & Italian Institute of Technology (IIT)*

      Developed bio-inspired visual attention models using event-driven sensing and neuromorphic platforms for the iCub robot.
    time: 2019 - 2022
  - content: >
      #### Software Engineer - Computer Vision for Robotics
      *Italian Institute of Technology (Genoa, Italy)*

      Engineered software for a robotic conversational healthcare application with IBM and Vodafone, and a computer vision project with Sony Japan.
    time: 2018 - 2019
  - content: >
      #### Research Fellow, Computer Vision - Predictive Coding & Robotics
      *King's College of London (London, UK)*

      Designed an egocentric neuromorphic network for 3D space perception using supervised learning.
    time: 2016 - 2017

